<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>GVC Display | Player</title>
  <link rel="icon" href="../assets/logos/logo_grupogvc_white.ico" type="image/x-icon"/>
  <link rel="stylesheet" href="../css/player.css"/>
</head>
<body>
  <!-- Previne modo sleep -->
  <video id="nosleep-vid" autoplay muted loop playsinline
    style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:.01;pointer-events:none">
    <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAA" type="video/mp4"/>
  </video>

  <div id="stage"></div>
  <div id="hud"><div id="hud-bar" style="width:0%"></div></div>
  <div id="debug"></div>

  <!-- ── TELA DE PAREAMENTO ── -->
  <div id="pairing">

    <!-- Esquerda: instruções + código -->
    <div class="pair-left">
      <div class="pair-logo">
        <!-- ícone TV inline SVG (sem dependência de fonte) -->
        <svg width="36" height="36" viewBox="0 0 24 24" fill="#4f8cff"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        <div class="pair-logo-txt">GVC <span>Display</span></div>
      </div>

      <div class="pair-headline">Configure<br>esta TV</div>

      <p class="pair-sub">
        Escaneie o QR Code ao lado com o celular<br>
        ou digite o código no painel administrativo.
      </p>

      <div class="pair-code-wrap">
        <div class="pair-code-label">Código de pareamento</div>
        <div class="pair-code" id="pair-code">------</div>
        <div class="pair-timer" id="pair-timer"></div>
      </div>

      <div class="pair-hint" id="pair-hint">Aguardando vinculação...</div>
    </div>

    <!-- Divisor -->
    <div class="pair-divider"></div>

    <!-- Direita: QR Code -->
    <div class="pair-right">
      <div class="pair-qr-box" id="qr-box">
        <!-- QR gerado via JS -->
        <svg viewBox="0 0 10 10"><rect width="10" height="10" fill="#eee"/><text x="50%" y="55%" text-anchor="middle" font-size="1.2" fill="#999">aguarde</text></svg>
      </div>
      <div class="pair-qr-label">
        Escaneie com a câmera do celular para acessar o painel e vincular esta TV
      </div>
      <div class="pair-qr-url" id="qr-admin-url"></div>
    </div>

  </div>

  <!-- ── TELA DE ERRO ── -->
  <div id="error-screen" class="hidden">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="#f59e0b"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    <div style="font-size:20px;font-weight:600;color:#e8eaf0;" id="error-msg">Erro ao carregar conteúdo</div>
    <small style="color:#6b7394;">Tentando reconectar...</small>
  </div>

  <script src="../js/player.js"></script>
</body>
</html>
