<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>GVC Display | Login</title>
  <link rel="icon" href="assets/logos/logo_grupogvc_white.ico" type="image/x-icon"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg1); }
    .card-login {
      width: 100%; max-width: 380px;
      background: var(--bg2);
      border: 1px solid var(--bord);
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .card-login .logo {
      display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:28px;
    }
    .card-login .brand { font-size:22px; font-weight:700; }
    .card-login .brand span { color:var(--primary); }
    .card-login .sub { font-size:12px; color:var(--mut); }
    .fg { display:flex; flex-direction:column; gap:5px; margin-bottom:16px; }
    .fg label { font-size:13px; color:var(--txt2); font-weight:500; }
    .fg input {
      padding:10px 14px; background:var(--bg3);
      border:1px solid var(--bord2); border-radius:8px;
      color:var(--txt); font-size:14px; outline:none; transition:.15s;
    }
    .fg input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(91,127,255,.15); }
    .btn-enter {
      width:100%; padding:11px; background:var(--primary);
      border:none; border-radius:9px; color:#fff;
      font-size:14px; font-weight:600; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:8px;
      transition:.15s; margin-top:4px;
    }
    .btn-enter:hover { background:#4070e8; }
    .btn-enter:disabled { opacity:.6; cursor:default; }
    #l-err {
      background:rgba(255,79,106,.1); border:1px solid rgba(255,79,106,.3);
      border-radius:8px; padding:10px 14px; color:var(--red);
      font-size:13px; margin-bottom:14px; display:none;
    }
  </style>
</head>
<body>
  <div class="card-login">
    <div class="logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="8" width="44" height="28" rx="4" fill="#1a1f2e" stroke="#4f8cff" stroke-width="2.5"/>
        <rect x="8" y="14" width="32" height="16" rx="2" fill="#0d1117"/>
        <rect x="18" y="38" width="12" height="3" rx="1.5" fill="#4f8cff"/>
        <rect x="14" y="41" width="20" height="2" rx="1" fill="#4f8cff" opacity=".5"/>
        <circle cx="24" cy="22" r="4" fill="#4f8cff" opacity=".8"/>
        <path d="M21 22l2 2 4-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div style="text-align:center;">
        <div class="brand">GVC <span>Display</span></div>
        <div class="sub">Apresentação Coorporativa Digital</div>
      </div>
    </div>

    <div id="l-err"></div>

    <form onsubmit="doLogin(event)" autocomplete="on">
      <div class="fg">
        <label for="l-email">E-mail</label>
        <input type="email" id="l-email" name="email" placeholder="admin@empresa.com"
               autocomplete="username" required/>
      </div>
      <div class="fg">
        <label for="l-pass">Senha</label>
        <input type="password" id="l-pass" name="password" placeholder="••••••••"
               autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn-enter" id="btn-login">
        Entrar <i class="bi bi-arrow-right"></i>
      </button>
    </form>
  </div>

  <script>
    // Detecta base do projeto
    const _base = window.location.pathname.replace(/\/(login)(\/.*)?$/, '').replace(/\/+$/, '');
    const _api  = window.location.origin + _base + '/api';

    // Se já tem token válido, redireciona
    if (localStorage.getItem('gvc_token')) {
      window.location.replace(_base + '/');
    }

    async function doLogin(e) {
      if (e) e.preventDefault();
      const email = document.getElementById('l-email').value.trim();
      const pass  = document.getElementById('l-pass').value;
      const errEl = document.getElementById('l-err');
      const btn   = document.getElementById('btn-login');

      errEl.style.display = 'none';
      if (!email || !pass) {
        errEl.textContent = 'Preencha e-mail e senha';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled  = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Entrando...';

      try {
        const res = await fetch(_api + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass }),
        });
        const raw  = await res.text();
        const clean = raw.replace(/^[^{[]*/, '');
        const data  = JSON.parse(clean);

        if (!res.ok) throw new Error(data?.error || 'Credenciais inválidas');

        localStorage.setItem('gvc_token', data.data?.token ?? data.token);
        window.location.replace(_base + '/');
      } catch (err) {
        errEl.textContent   = err.message || 'E-mail ou senha inválidos';
        errEl.style.display = 'block';
        btn.disabled        = false;
        btn.innerHTML       = 'Entrar <i class="bi bi-arrow-right"></i>';
      }
    }
  </script>
</body>
</html>
