<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>GVC Display | Login</title>
  <link rel="icon" href="assets/logos/logo_gvc_display.ico" type="image/x-icon"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/login.css"/>
</head>
<body>

  <div class="login-page">
    <div class="card-login">

      <div class="logo">
        <img class="logo-img" src="assets/logos/logo_gvc_display_192.png" alt="GVC Display"/>
        <div>
          <div class="brand">GVC <span>Display</span></div>
          <div class="sub">Sinalização Digital Corporativa</div>
        </div>
      </div>

      <div id="l-err">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span id="l-err-txt"></span>
      </div>

      <form onsubmit="doLogin(event)" autocomplete="on">
        <div class="fg">
          <label for="l-email">E-mail</label>
          <input type="email" id="l-email" name="email"
                 placeholder="admin@empresa.com"
                 autocomplete="username" required/>
        </div>
        <div class="fg">
          <label for="l-pass">Senha</label>
          <input type="password" id="l-pass" name="password"
                 placeholder="••••••••"
                 autocomplete="current-password" required/>
        </div>
        <button type="submit" class="btn-enter" id="btn-login">
          Entrar <i class="bi bi-arrow-right"></i>
        </button>
      </form>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
